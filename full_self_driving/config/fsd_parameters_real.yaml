schema_version: "1.0.0"
deployment_id: "fsd_real_hardware_flight"
profile: "real_hardware"
engineering_config_revision: 1

# ==============================================================================
# 1. REAL HARDWARE FLIGHT ENVIRONMENT CONFIGURATION
# ==============================================================================
simulation:
  world: "kmitl_airfield"
  headless: true
  use_sim_time: false

# ==============================================================================
# 2. SAFETY GATES & INVARIANTS (PHYSICAL HARDWARE)
# ==============================================================================
safety:
  max_altitude_m: 20.0
  min_battery_percentage: 25.0
  target_loss_timeout_s: 3.0
  emergency_stop_enabled: true

# ==============================================================================
# 3. FLIGHT ROUTE DYNAMICS & KINEMATICS (TUNED FOR REAL DRONE)
# ==============================================================================
routes:
  transit_in_speed_m_s: 3.0
  transit_out_speed_m_s: 3.0
  transit_altitude_m: 20.0
  search_altitude_m: 12.0
  approach_altitude_m: 2.0
  max_horizontal_velocity_m_s: 3.0
  landing_descent_rate_m_s: 0.25
  acceptance_radius_m: 4.0
  max_yaw_rate_deg_s: 45.0
  search_policy: "complete_grid_first"

# ==============================================================================
# 4. PERCEPTION & TARGET RECOGNITION (PHYSICAL CAMERA & MARKERS)
# ==============================================================================
perception:
  dictionary: "DICT_4X4_50"
  marker_size_m: 0.40
  lock_min_consecutive_observations: 2
  lock_spatial_consistency_radius_m: 5.0

# ==============================================================================
# 5. PAYLOAD & HARDWARE INTEGRATION
# ==============================================================================
payload:
  adapter_type: "px4_uorb_gripper_actuator"  # Options: px4_uorb_gripper_actuator, esp32_serial_bridge
  gripper_instance: 1
  port: "/dev/ttyACM0"
  baud: 115200

# ==============================================================================
# 6. SYSTEM ADAPTERS
# ==============================================================================
adapters:
  px4_transport: "px4_hardware_uart_serial"
  camera_adapter: "v4l2_hardware_camera"
  payload_adapter: "px4_uorb_gripper_actuator"

# ==============================================================================
# 7. TARGET SCOPE & CONSTRAINTS
# ==============================================================================
target_constraints:
  marker_id_min: 0
  marker_id_max: 1000
  allowed_dictionaries:
    - "DICT_4X4_50"
    - "DICT_4X4_250"
    - "DICT_5X5_50"
  allowed_namespaces:
    - "aavc2026"
    - "sar_search"
    - "cargo_delivery"
