schema_version: "1.0.0"
deployment_id: "fsd_kmitl_simulation_default"
profile: "simulation"

simulation:
  world: "kmitl_airfield"
  headless: false
  use_sim_time: true

safety:
  max_altitude_m: 30.0
  min_battery_percentage: 20.0
  target_loss_timeout_s: 2.0
  landing_descent_rate_m_s: 0.5
  max_horizontal_velocity_m_s: 5.0

routes:
  transit_in_speed_m_s: 5.0
  transit_out_speed_m_s: 3.0
  search_altitude_m: 15.0
  approach_altitude_m: 5.0
  acceptance_radius_m: 4.0
  max_yaw_rate_deg_s: 45.0

adapters:
  px4_transport: "px4_sitl_uxrce_dds"
  camera_adapter: "ros_gz_image_bridge"
  payload_adapter: "simulation_payload_stub"
