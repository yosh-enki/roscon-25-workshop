aruco_database:
  ros__parameters:
    use_sim_time: true
    detection_topic: "/aruco/detections"
    global_position_topic: "/fmu/out/vehicle_global_position"
    vehicle_frame: "base_link_frd"
    database_file: "database/markers.yaml"
    world_frame: "odom_ned"
    auto_origin: true
    origin_configured: false
    origin_latitude_deg: 0.0
    origin_longitude_deg: 0.0
    save_period_s: 2.0
    save_on_update: true
    save_min_interval_ms: 200
    transform_timeout_s: 0.05
