transit_in:
  ros__parameters:
    # Relative altitude above the PX4 home altitude, in metres.
    transit_in_alt: 15.0

    # Replace this comment with a flattened [latitude_deg, longitude_deg, ...] route.
    # Example: waypoints: [13.7563, 100.5018, 13.7568, 100.5024]
    waypoints: [13.730322, 100.787446, 13.730397, 100.788694, 13.730712, 100.788755 ]

    # Optional alternative to `waypoints`: set waypoint_latitudes and waypoint_longitudes
    # as equal-length arrays when you do not use `waypoints`.

    # The next waypoint is selected when horizontal distance is within this radius.
    arrival_radius_m: 4.0

    # Requested horizontal speed cap. The node hard-limits this to 10.0 m/s.
    max_horizontal_speed_m_s: 5.0

    # Vertical correction speed used to hold the requested altitude.
    max_vertical_speed_m_s: 1.0

    # Limits how quickly the heading setpoint can turn, making course changes smooth.
    max_heading_rate_deg_s: 45.0

    # Below this actual ground speed, keep the previous heading to avoid jitter.
    course_heading_min_speed_m_s: 0.3

    # Completion requires this AMSL altitude error and vertical-speed settling limit.
    altitude_tolerance_m: 1.0
    altitude_settle_speed_m_s: 0.5

    # Required telemetry must arrive within this time after activation.
    data_timeout_s: 2.0

    use_sim_time: true
