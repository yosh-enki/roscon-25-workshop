# MQTT and Node-RED configuration for aruco_database_bridge.
#
# Keep credentials empty here and provide them through:
#   HIVEMQ_MQTT_USERNAME
#   HIVEMQ_MQTT_PASSWORD
#
# An empty mqtt_host intentionally runs the bridge in ROS-only mode without
# opening an MQTT connection.
aruco_database_bridge:
  ros__parameters:
    use_sim_time: true
    mqtt_host: ""
    mqtt_port: 8883
    mqtt_username: ""
    mqtt_password: ""
    mqtt_client_id: "aruco_database_bridge"
    mqtt_topic_prefix: "aruco_database"
    mqtt_tls_ca_file: ""
    status_publish_period_ms: 1000
    core_status_timeout_ms: 5000
